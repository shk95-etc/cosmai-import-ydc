# Which verification a change needs (#215, #231). `tool/checks/test --changed <base>` reads this
# file and `tool/change_scope.py` turns it into a class: A runs everything, B runs the computed set
# (mapped tests + the readers map + the import closure + the smoke set), C runs the format/lint/lang
# checks and the tests below.
#
# `gate` is the classifier's own machinery: a wrong entry here is the one error the classifier
# cannot catch itself, so a change touching one of these is class A no matter how small it looks --
# no proof talks it down (#230). Since #232, "class A" is a verdict CI always backstops, not
# necessarily a run this push pays for itself: a gate change judges its own blast radius locally
# too (the computed set it owes, when it has one), and the whole-suite run happens on GitHub.
gate = [
    "tests/conftest.py",
    "tests/scope.toml",
    "tool/change_scope.py",
    "tool/invariants.py",
    "tool/checks/test",
    "tool/checks/invariants",
    "tool/checks/suite-lock",
    "tool/checks/tested-tree",
    "pyproject.toml",
    "uv.lock",
]

# `trigger` replaces the old `full` list's role (#231, D2'): a change here still costs the whole
# suite, but only these paths are presumed guilty by default -- everything else, on any branch and
# on main, runs the computed set below. #230's proof still applies: a comment-only edit to one of
# these earns class C, a real change still forces A (D1 stands). Some entries here also sit in
# `gate` above -- `gate` is checked first and answers for those unconditionally; this list is kept
# as option 10's decision text in full, so the two do not drift apart silently.
trigger = [
    "contracts/ddl/",
    "db/views/",
    "db/migrate.sh",
    "db/bootstrap",
    # A deploy artifact, the same as db/views/ and db/migrate.sh: the role grants a deploy applies,
    # not a one-off backfill (review 2026-09-05, the issue's open question).
    "db/grants/",
    "tests/conftest.py",
    "tests/scope.toml",
    "tool/checks/",
    "pyproject.toml",
    "uv.lock",
    # #232 review: `uv sync` resolves this interpreter for the whole suite -- an unpinned or wrong
    # version is the same "the environment itself changed" risk pyproject.toml and uv.lock sit on
    # this list for (a class-A run failed on exactly this before the pin existed).
    ".python-version",
    "analysis/types.py",
    "cosmai/cli.py",
]

# What a prose or translation change is verified by: the checks in tool/checks/{format,lint,lang}
# plus these. `cosmai --help` is a byte snapshot, the version strings are the other user-facing text,
# and AGENTS.md has a size ceiling a docs edit is exactly the thing that breaks.
docs = [
    "tests/test_cli_help.py",
    "tests/test_version_strings.py",
    "tests/test_agents_md.py",
]

# The smoke set (#231 Work 1d): always part of the computed set, whatever package a change lands
# in -- the five surfaces a change anywhere could quietly break (the CLI's own help text, the
# version strings, the registry's default wiring, the map's own health, the stack's wiring).
smoke = [
    "tests/test_cli_help.py",
    "tests/test_version_strings.py",
    "tests/test_registry_loading.py",
    "tests/test_scope_map.py",
    "tests/stack/test_stack_wiring.py",
]

# No-answer paths (#231 item 3): none of these carry a test of their own, and a real edit to any of
# them is class C with no tests at all, comment-only or not -- nothing at runtime reads a
# .gitignore, a README, a playbook snippet or a GitHub Actions/Claude config file. (A .gitignore
# edit was class A before #230's empty map entry moved it to B without saying so anywhere; this is
# where that decision belongs.) playbook/ also keeps its (redundant) empty [map] entry below, so
# tests/test_scope_map.py's "every code directory has an entry" check still finds it.
none = [
    ".github/",
    ".claude/",
    "README",
    "LICENSE",
    ".gitignore",
    ".dockerignore",
    "playbook/",
]

