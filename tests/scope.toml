# Glob readers (#231 Work 5): a test that finds one of these directories' files by glob/rglob/
# iterdir rather than by name is invisible to the readers map, which only scans test source for a
# literal name or path. Pattern (fnmatch, matched against the repo-relative changed path) -> the
# tests that read it that way. tests/test_scope_map.py pins that every such test in the tree is
# listed here.
[readers]
"stack/crontab.d/*" = [
    "tests/test_analyze_all.py",
    "tests/test_pipeline_stage.py",
    "tests/collectors/naver/test_naver_schedule.py",
    "tests/collectors/commerce/test_every_dataset_is_collected_and_scheduled.py",
    "tests/collectors/youtube/test_every_dataset_is_scheduled.py",
]
# tests/test_ruff_extend_include.py rglobs the whole tool/ tree for python-shebang scripts (#202,
# #220) rather than naming any one of them, so the readers map's basename scan can never find it.
"tool/*" = ["tests/test_ruff_extend_include.py"]
# .github/ is on the `none` list above (nothing at runtime reads it), which would otherwise leave a
# workflow edit at zero tests -- but .github/workflows/suite.yml is #232's own wiring, and this test
# is its wiring test (#232 Work 4).
".github/workflows/*" = ["tests/tool/test_ci_workflow.py"]
# The interpreter the class-a run and every dev push resolve has to be the one the tests/snapshots/
# cosmai_help.txt snapshot was recorded under (review 2026-09-05: a mismatch here is exactly what
# broke run 33954240253); no basename scan finds it by prefix, so it is a reader like the two above.
".python-version" = ["tests/tool/test_ci_workflow.py"]
